{# Country-page leaderboard: reuses the same athlete-card styling as /leaderboard. #}
{% if not athletes %}
<div class="country-empty">No ranked athletes for this category.</div>
{% else %}
<div class="leaderboard-grid" id="country-leaderboard-grid">
    {% include "partials/country_leaderboard_rows.html" %}
</div>
{% if has_more %}
<div class="country-more-wrap">
    <button type="button" class="btn-country-more" id="country-more-btn">See more</button>
</div>
{% endif %}
{% endif %}
