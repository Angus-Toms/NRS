{# Table download button: opens the format modal (utils.js initDownloadButtons).
   Expects download_url; optional download_id. #}
<button type="button" class="btn-download" {% if download_id %}id="{{ download_id }}" {% endif %}data-download-url="{{ download_url }}" title="Download this table">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span class="btn-download-label">Download</span>
</button>
