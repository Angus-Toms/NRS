{% extends "base.html" %}

{% block title %}{{ post.title }} - Pro Tri Data{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ STATIC_BASE_URL }}css/about.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="renderMathInElement(document.body, {delimiters: [{left:'$$', right:'$$', display:true},{left:'$', right:'$', display:false}]});"></script>
{% endblock %}

{% block hero %}
<div class="page-hero">
    <div class="page-hero-inner">
        <a href="/about" class="blog-back"><svg viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="height:0.75em;width:auto;vertical-align:middle;margin-right:0.35em"><polyline points="6,1 1,6 6,11"/></svg>Back</a>
        <h1>{{ post.title }}</h1>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="blog-detail">
    <div class="blog-body">{{ post.body_html | safe }}</div>
</div>
{% if post.has_js %}
<script defer src="{{ STATIC_BASE_URL }}about/blogs/{{ post.slug }}.js"></script>
{% endif %}
{% endblock %}
